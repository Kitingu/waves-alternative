services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: waves_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - waves_data:/var/lib/postgresql/data
volumes:
  waves_data:
